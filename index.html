<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211936">
<title>SAM 宠物蛋 V1.2</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:linear-gradient(160deg,#55418c,#17152d);
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding:18px;
}

.app{
 max-width:450px;
 margin:auto;
 text-align:center;
}

h1{
 font-size:25px;
}

.card{
 background:#ffffff18;
 border:1px solid #ffffff25;
 border-radius:25px;
 padding:20px;
 margin:15px 0;
}

.stats{
 display:flex;
 justify-content:space-around;
 gap:8px;
}

.stat{
 background:#ffffff15;
 padding:12px;
 border-radius:15px;
 flex:1;
}

.egg{
 font-size:110px;
 margin:25px auto;
 animation:bounce 2s infinite;
 cursor:pointer;
 user-select:none;
}

@keyframes bounce{
 50%{
  transform:translateY(-12px);
 }
}

button{
 border:0;
 border-radius:14px;
 padding:13px 16px;
 margin:5px;
 background:#9476ed;
 color:white;
 font-size:15px;
 font-weight:bold;
}

button:active{
 transform:scale(.95);
}

.progress{
 background:#ffffff25;
 height:13px;
 border-radius:20px;
 overflow:hidden;
 margin:12px 0;
}

.bar{
 height:100%;
 width:0%;
 background:#ffd36c;
 transition:width .3s;
}

.message{
 min-height:35px;
 color:#ffe6a6;
 margin-top:15px;
}

.menu{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.pet-list{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:12px;
}

.pet-item{
 background:#ffffff15;
 border-radius:12px;
 padding:12px 5px;
}

.small{
 font-size:12px;
 color:#ddd;
}
</style>
</head>

<body>

<div class="app">

<h1>🥚 SAM 宠物蛋</h1>

<p>欢迎来到你的宠物世界！</p>

<p style="color:#ffe6a6;font-size:13px">
SAM PET EGG V1.2
</p>

<div class="card">

<div class="stats">

<div class="stat">
🪙 金币<br>
<b id="coins">100</b>
</div>

<div class="stat">
⭐ 等级<br>
<b id="level">1</b>
</div>

<div class="stat">
❤️ 心情<br>
<b id="happy">100</b>
</div>

</div>

</div>

<div class="card">

<h3 id="title">神秘宠物蛋</h3>

<div
 id="egg"
 class="egg"
 onclick="tapEgg()">
🥚
</div>

<div id="status">
等待孵化中……
</div>

<div class="progress">
<div
 class="bar"
 id="bar">
</div>
</div>

<p id="percent">
孵化进度：0%
</p>

<button
 id="newEggBtn"
 onclick="startNewEgg()"
 style="display:none">

🥚 孵化新蛋

</button>

<div class="menu">

<button onclick="feed()">
🍖 喂食
</button>

<button onclick="play()">
🎮 玩耍
</button>

<button onclick="clean()">
🛁 清洁
</button>

<button onclick="reward()">
🎁 每日奖励
</button>

</div>

<div
 class="message"
 id="message">

点击蛋开始你的冒险！

</div>

</div>

<div class="card">

<h3>🏪 宠物商店</h3>

<button onclick="buyFood()">
购买食物 20金币
</button>

<button onclick="buyToy()">
购买玩具 30金币
</button>

</div>

<div class="card">

<h3>📖 我的宠物图鉴</h3>

<p id="currentPet">
目前还没有宠物
</p>

<div
 id="collection"
 class="pet-list">
</div>

<p class="small">
继续孵化，可以收集更多不同宠物！
</p>

</div>

<p style="color:#aaa;font-size:12px">
SAM PET EGG V1.2 · 自动保存
</p>

</div>

<script>

"use strict";

const KEY="SAM_PET_EGG_V1";

let game={
 coins:100,
 level:1,
 exp:0,
 growthExp:0,
 growthLevel:1,
 happy:100,
 progress:0,
 hatched:false,
 lastReward:"",
 petEmoji:"🐣",
 petName:"小鸡",
 rarity:"普通",
 ageStage:"幼年",
 collection:[]
};

const pets=[
 {
  name:"小鸡",
  emoji:"🐣",
  rarity:"普通",
  weight:60
 },
 {
  name:"小狗",
  emoji:"🐶",
  rarity:"稀有",
  weight:15
 },
 {
  name:"小猫",
  emoji:"🐱",
  rarity:"稀有",
  weight:10
 },
 {
  name:"小兔",
  emoji:"🐰",
  rarity:"史诗",
  weight:8
 },
 {
  name:"小狐狸",
  emoji:"🦊",
  rarity:"史诗",
  weight:5
 },
 {
  name:"神秘龙",
  emoji:"🐲",
  rarity:"传说",
  weight:2
 }
];

function msg(t){
 document.getElementById("message").textContent=t;
}

function save(){
 try{
  localStorage.setItem(
   KEY,
   JSON.stringify(game)
  );
 }catch(e){}
}

function load(){

 try{

  let old=
   localStorage.getItem(KEY);

  if(old){

   let data=
    JSON.parse(old);

   if(data &&
      typeof data==="object"){

    game={
     ...game,
     ...data
    };

   }

  }

 }catch(e){}

 if(!Array.isArray(game.collection)){
  game.collection=[];
 }

if(game.hatched){

 if(!game.growthExp){
  game.growthExp=0;
 }

 if(!game.growthLevel){
  game.growthLevel=1;
 }

 if(!game.ageStage){
  game.ageStage="幼年";
 }

}
 
 if(game.hatched &&
    game.petName){

  let exists=
   game.collection.some(
    p=>
     p.name===game.petName &&
     p.emoji===game.petEmoji
   );

  if(!exists){

   game.collection.push({
    name:game.petName,
    emoji:game.petEmoji,
    rarity:game.rarity||"普通"
   });

  }

 }
dailyGrowth();
 render();
}

function render(){

 document.getElementById("coins")
 .textContent=game.coins;

 document.getElementById("level")
 .textContent=game.level;

 document.getElementById("happy")
 .textContent=game.happy;

 document.getElementById("bar")
 .style.width=
 game.progress+"%";

 document.getElementById("percent")
 .textContent=
 "孵化进度："+game.progress+"%";

 if(game.hatched){

  document.getElementById("egg")
  .textContent=game.petEmoji;

  document.getElementById("title")
  .textContent=game.petName;

  document.getElementById("status")
.textContent=
 "稀有度："+game.rarity+
 " · 年龄："+(game.ageStage||"幼年")+
 " · 成长："+(game.growthExp||0)+"/100";

  document.getElementById("currentPet")
  .textContent=
   "当前宠物："+
   game.petEmoji+
   " "+
   game.petName+
   "（"+
   game.rarity+
   "）";

  document.getElementById("newEggBtn")
  .style.display="inline-block";

 }else{

  document.getElementById("egg")
  .textContent="🥚";

  document.getElementById("title")
  .textContent="神秘宠物蛋";

  document.getElementById("status")
  .textContent=
   "等待孵化中……";

  document.getElementById("currentPet")
  .textContent=
   "目前正在孵化神秘蛋";

  document.getElementById("newEggBtn")
  .style.display="none";

 }

 let collection=
  document.getElementById("collection");

 collection.innerHTML="";

 if(game.collection.length===0){

  collection.innerHTML=
   "<p>尚未收集宠物</p>";

 }else{

  game.collection.forEach(function(pet){

   let item=
    document.createElement("div");

   item.className="pet-item";

   item.textContent=
    pet.emoji+
    " "+
    pet.name+
    " · "+
    pet.rarity;

   collection.appendChild(item);

  });

 }

}

function tapEgg(){

 if(game.hatched){

  game.happy=
   Math.min(
    100,
    game.happy+1
   );

  msg("🐾 宠物很开心！");

  save();
  render();

  return;
 }

 game.progress=
  Math.min(
   100,
   game.progress+2
  );

 if(game.progress>=100){

  hatchPet();

 }else{

  msg(
   "🥚 孵化进度增加2%！"
  );

 }

 save();
 render();
}

function hatchPet(){

 let roll=
  Math.random()*100;

 let total=0;

 let selected=
  pets[0];

 for(let pet of pets){

  total+=pet.weight;

  if(roll<total){

   selected=pet;
   break;

  }

 }

 game.petName=
  selected.name;

 game.petEmoji=
  selected.emoji;

 game.rarity=
  selected.rarity;

game.ageStage="幼年";

game.hatched=true;

 game.progress=100;

 game.coins+=100;

 game.exp+=20;

 let exists=
  game.collection.some(
   p=>
    p.name===selected.name &&
    p.emoji===selected.emoji
  );

 if(!exists){

  game.collection.push({
   name:selected.name,
   emoji:selected.emoji,
   rarity:selected.rarity
  });

 }

 msg(
  "🎉 孵化成功！获得："+
  selected.name+
  "（"+
  selected.rarity+
  "）"
 );

}

function startNewEgg(){

 if(!game.hatched){
  return;
 }

 game.hatched=false;
 game.progress=0;

 msg(
  "🥚 新宠物蛋已经准备好！"
 );

 save();
 render();

}

function gainExp(n){

  // 1. 增加玩家经验
  game.exp += n;

  // 2. 检查玩家是否升级
  while (game.exp >= game.level * 50) {

    game.exp -= game.level * 50;
    game.level += 1;
    game.coins += 50;

    msg("🎉 玩家升级成功！获得50金币！");
  }

  // 3. 检查宠物是否已经孵化
  if (!game.hatched) {
    return;
  }

  // 4. 增加宠物成长经验
  game.growthExp =
    (game.growthExp || 0) + n;

  // 5. 检查宠物成长
  if (game.growthExp < 100) {
    return;
  }

  if ((game.growthLevel || 1) >= 3) {
    game.growthExp = 100;
    return;
  }

  // 6. 宠物进入下一个成长阶段
  game.growthExp -= 100;
  game.growthLevel =
    (game.growthLevel || 1) + 1;

  if (game.growthLevel === 2) {

    game.ageStage = "成长期";

  } else if (game.growthLevel === 3) {

    game.ageStage = "成年";

  }

  msg(
    "🎉 宠物成长成功！现在是：" +
    game.ageStage
  );

}

 function dailyGrowth(){

 if(!game.hatched)return;

 if((game.growthLevel||1)<2){

  game.growthLevel=2;
  game.ageStage="成长期";
  game.growthExp=0;

  msg("🎉 宠物进入成长期！");

 }else if(game.growthLevel<3){

  game.growthLevel=3;
  game.ageStage="成年";
  game.growthExp=0;

  msg("🎉 宠物进入成年期！");

 }

 save();
 render();

}
 
function feed(){

 if(game.coins<10){

  msg("金币不足！");
  return;

 }

 game.coins-=10;

 game.happy=
  Math.min(
   100,
   game.happy+10
  );

 gainExp(5);

 save();
 render();

 msg("🍖 喂食成功！");

}

function play(){

 if(game.coins<5){

  msg("金币不足！");
  return;

 }

 game.coins-=5;

 game.happy=
  Math.min(
   100,
   game.happy+8
  );

 gainExp(8);

 save();
 render();

 msg("🎮 玩耍成功！");

}

function clean(){

 game.happy=
  Math.min(
   100,
   game.happy+5
  );

 gainExp(3);

 save();
 render();

 msg("🛁 清洁完成！");

}

function reward(){

 let today=
  new Date()
  .toLocaleDateString();

 if(game.lastReward===today){

  msg(
   "今天已经领取奖励！"
  );

  return;

 }

 game.lastReward=
  today;

 game.coins+=50;

 game.happy=
  Math.min(
   100,
   game.happy+10
  );

 save();
 render();

 msg(
  "🎁 获得50金币！"
 );

}

function buyFood(){

 if(game.coins<20){

  msg("金币不足！");
  return;

 }

 game.coins-=20;

 game.happy=
  Math.min(
   100,
   game.happy+20
  );

 save();
 render();

 msg(
  "🍖 食物购买成功！"
 );

}

function buyToy(){

 if(game.coins<30){

  msg("金币不足！");
  return;

 }

 game.coins-=30;

 game.happy=
  Math.min(
   100,
   game.happy+30
  );

 save();
 render();

 msg(
  "🧸 玩具购买成功！"
 );

}

load();

</script>

</body>
</html>
