
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211936">
<title>SAM 宠物蛋 V1.2</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:linear-gradient(160deg,#55418c,#17152d);
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding:18px;
}
.app{max-width:450px;margin:auto;text-align:center}
h1{font-size:25px}
.version{color:#ffe6a6;font-size:13px}
.card{
 background:#ffffff18;
 border:1px solid #ffffff25;
 border-radius:25px;
 padding:20px;
 margin:15px 0;
}
.stats{display:flex;justify-content:space-around;gap:8px}
.stat{background:#ffffff15;padding:12px;border-radius:15px;flex:1}
.egg{
 font-size:110px;
 margin:25px auto;
 animation:bounce 2s infinite;
 cursor:pointer;
 user-select:none;
}
@keyframes bounce{
 50%{transform:translateY(-12px)}
}
button{
 border:0;
 border-radius:14px;
 padding:13px 16px;
 margin:5px;
 background:#9476ed;
 color:white;
 font-size:15px;
 font-weight:bold;
 cursor:pointer;
}
button:active{transform:scale(.95)}
.progress{
 background:#ffffff25;
 height:13px;
 border-radius:20px;
 overflow:hidden;
 margin:12px 0
}
.bar{
 height:100%;
 width:0%;
 background:#ffd36c;
 transition:width .3s
}
.message{min-height:35px;color:#ffe6a6;margin-top:15px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pet-list{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:12px;
}
.pet-item{
 background:#ffffff15;
 border-radius:12px;
 padding:12px 5px;
}
.small{font-size:12px;color:#ddd}
</style>
</head>
<body>
<div class="app">

<h1>🥚 SAM 宠物蛋</h1>
<p>欢迎来到你的宠物世界！</p>
<div class="version">SAM PET EGG V1.2</div>

<div class="card">
 <div class="stats">
  <div class="stat">🪙 金币<br><b id="coins">100</b></div>
  <div class="stat">⭐ 等级<br><b id="level">1</b></div>
  <div class="stat">❤️ 心情<br><b id="happy">100</b></div>
 </div>
</div>

<div class="card">
 <h3 id="title">神秘宠物蛋</h3>
 <div id="egg" class="egg" onclick="tapEgg()">🥚</div>
 <div id="status">等待孵化中……</div>

 <div class="progress">
  <div class="bar" id="bar"></div>
 </div>

 <p id="percent">孵化进度：0%</p>

 <button id="newEggBtn" onclick="startNewEgg()" style="display:none">
  🥚 孵化新蛋
 </button>

 <div class="menu">
  <button onclick="feed()">🍖 喂食</button>
  <button onclick="play()">🎮 玩耍</button>
  <button onclick="clean()">🛁 清洁</button>
  <button onclick="reward()">🎁 每日奖励</button>
 </div>

 <div class="message" id="message">
  点击蛋开始你的冒险！
 </div>
</div>

<div class="card">
 <h3>🏪 宠物商店</h3>
 <button onclick="buyFood()">购买食物 20金币</button>
 <button onclick="buyToy()">购买玩具 30金币</button>
</div>

<div class="card">
 <h3>📖 我的宠物图鉴</h3>
 <p id="currentPet">目前还没有宠物</p>
 <div id="collection" class="pet-list"></div>
 <p class="small">继续孵化，可以收集更多不同宠物！</p>
</div>

<p class="version">SAM PET EGG V1.2 · 自动保存</p>
</div>

<script>
"use strict";

const KEY="SAM_PET_EGG_V1";

const defaultGame={
 coins:100,
 level:1,
 exp:0,
 happy:100,
 progress:0,
 hatched:false,
 lastReward:"",
 petEmoji:"🐣",
 petName:"小鸡",
 rarity:"普通",
 collection:[]
};

let game={...defaultGame};

const pets=[
 {name:"小鸡",emoji:"🐣",rarity:"普通",weight:60},
 {name:"小狗",emoji:"🐶",rarity:"稀有",weight:15},
 {name:"小猫",emoji:"🐱",rarity:"稀有",weight:10},
 {name:"小兔",emoji:"🐰",rarity:"史诗",weight:8},
 {name:"小狐狸",emoji:"🦊",rarity:"史诗",weight:5},
 {name:"神秘龙",emoji:"🐲",rarity:"传说",weight:2}
];

function msg(t){
 document.getElementById("message").textContent=t;
}

function save(){
 try{
  localStorage.setItem(KEY,JSON.stringify(game));
 }catch(e){
  msg("保存失败，请检查浏览器存储设置！");
 }
}

function load(){
 try{
  const old=localStorage.getItem(KEY);

  if(old){
   const data=JSON.parse(old);

   if(data && typeof data==="object"){
    game={...defaultGame,...data};
   }
  }
 }catch(e){
  game={...defaultGame};
 }

 game.coins=Math.max(0,Number(game.coins)||0);
 game.level=Math.max(1,Number(game.level)||1);
 game.exp=Math.max(0,Number(game.exp)||0);
 game.happy=Math.min(100,Math.max(0,Number(game.happy)||0));
 game.progress=Math.min(100,Math.max(0,Number(game.progress)||0));

 if(!Array.isArray(game.collection)){
  game.collection=[];
 }

 // 把旧版本已经孵化的宠物加入图鉴
 if(game.hatched && game.petName){
  const exists=game.collection.some(
   p=>p.name===game.petName && p.emoji===game.petEmoji
  );

  if(!exists){
   game.collection.push({
    name:game.petName,
    emoji:game.petEmoji,
    rarity:game.rarity||"普通"
   });
  }
 }

 save();
 render();
}

function render(){
 document.getElementById("coins").textContent=game.coins;
 document.getElementById("level").textContent=game.level;
 document.getElementById("happy").textContent=game.happy;

 document.getElementById("bar").style.width=
 game.progress+"%";

 document.getElementById("percent").textContent=
 "孵化进度："+game.progress+"%";

 const egg=document.getElementById("egg");
 const newBtn=document.getElementById("newEggBtn");

 if(game.hatched){
  egg.textContent=game.petEmoji;
  document.getElementById("title").textContent=game.petName;
  document.getElementById("status").textContent=
   "稀有度："+game.rarity+" · 已经孵化成功";

  document.getElementById("currentPet").textContent=
   "当前宠物："+game.petEmoji+" "+game.petName+
   "（"+game.rarity+"）";

  newBtn.style.display="inline-block";
 }else{
  egg.textContent="🥚";
  document.getElementById("title").textContent="神秘宠物蛋";
  document.getElementById("status").textContent="等待孵化中……";
  document.getElementById("currentPet").textContent=
   "目前正在孵化神秘蛋";

  newBtn.style.display="none";
 }

 const collection=document.getElementById("collection");
 collection.textContent="";

 if(game.collection.length===0){
  const p=document.createElement("p");
  p.textContent="尚未收集宠物";
  collection.appendChild(p);
 }else{
  game.collection.forEach(pet=>{
   const item=document.createElement("div");
   item.className="pet-item";
   item.textContent=
    pet.emoji+" "+pet.name+" · "+pet.rarity;
   collection.appendChild(item);
  });
 }
}

function gainExp(n){
 game.exp+=n;

 while(game.exp>=game.level*50){
  game.exp-=game.level*50;
  game.level++;
  game.coins+=50;
  msg("🎉 升级成功！获得50金币！");
 }
}

function tapEgg(){
 if(game.hatched){
  game.happy=Math.min(100,game.happy+1);
  msg("🐾 宠物很开心！");
  save();
  render();
  return;
 }

 game.progress=Math.min(100,game.progress+2);

 if(game.progress>=100){
  hatchPet();
 }else{
  msg("🥚 孵化进度增加2%！");
 }

 save();
 render();
}

function hatchPet(){
 let roll=Math.random()*100;
 let total=0;
 let selected=pets[0];

 for(const pet of pets){
  total+=pet.weight;

  if(roll<total){
   selected=pet;
   break;
  }
 }

 game.petName=selected.name;
 game.petEmoji=selected.emoji;
 game.rarity=selected.rarity;
 game.hatched=true;
 game.progress=100;
 game.coins+=100;
 game.exp+=20;

 const exists=game.collection.some(
  p=>p.name===selected.name && p.emoji===selected.emoji
 );

 if(!exists){
  game.collection.push({
   name:selected.name,
   emoji:selected.emoji,
   rarity:selected.rarity
  });
 }

 msg("🎉 孵化成功！获得："+selected.name+
 "（"+selected.rarity+"）");
}

function startNewEgg(){
 if(!game.hatched)return;

 game.hatched=false;
 game.progress=0;

 msg("🥚 新宠物蛋已经准备好！继续点击孵化吧！");
 save();
 render();
}

function feed(){
 if(game.coins<10){
  msg("金币不足！");
  return;
 }

 game.coins-=10;
 game.happy=Math.min(100,game.happy+10);
 gainExp(5);
 save();
 render();
 msg("🍖 喂食成功！");
}

function play(){
 if(game.coins<5){
  msg("金币不足！");
  return;
 }

 game.coins-=5;
 game.happy=Math.min(100,game.happy+8);
 gainExp(8);
 save();
 render();
 msg("🎮 玩耍成功！");
}

function clean(){
 game.happy=Math.min(100,game.happy+5);
 gainExp(3);
 save();
 render();
 msg("🛁 清洁完成！");
}

function reward(){
 const today=new Date().toLocaleDateString();

 if(game.lastReward===today){
  msg("今天已经领取奖励！");
  return;
 }

 game.lastReward=today;
 game.coins+=50;
 game.happy=Math.min(100,game.happy+10);

 save();
 render();
 msg("🎁 获得50金币！");
}

function buyFood(){
 if(game.coins<20){
  msg("金币不足！");
  return;
 }

 game.coins-=20;
 game.happy=Math.min(100,game.happy+20);

 save();
 render();
 msg("🍖 食物购买成功！");
}

function buyToy(){
 if(game.coins<30){
  msg("金币不足！");
  return;
 }

 game.coins-=30;
 game.happy=Math.min(100,game.happy+30);

 save();
 render();
 msg("🧸 玩具购买成功！");
}

load();
</script>
</body>
</html>
